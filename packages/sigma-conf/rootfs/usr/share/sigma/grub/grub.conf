# Sigma Linux boot menu: theme and kernel parameters.
#
# One source of truth for both boot menus:
#   * the live ISO's grub.cfg is rendered from it at build time;
#   * installed systems source it from /etc/default/grub (written by
#     sigma-grub-setup), so every grub-mkconfig run, including the one apk
#     triggers on kernel updates, keeps the Sigma look.
#
# Keep to plain KEY="value" lines: the ISO build reads this file without a
# shell. Per-machine overrides belong in /etc/default/grub, after the line
# that sources this file.

GRUB_DISTRIBUTOR="Sigma Linux"
GRUB_TIMEOUT=5
GRUB_GFXMODE=640x480
GRUB_TERMINAL_OUTPUT=gfxterm
GRUB_FONT=/boot/grub/fonts/unicode.pf2
GRUB_BACKGROUND=/boot/grub/wallpaper.png
GRUB_DISABLE_RECOVERY=true

# The Sigma kernel is the plain "Sigma Linux" entry; any other installed
# kernels go under "Advanced options for Sigma Linux".
GRUB_TOP_LEVEL=/boot/vmlinuz-sigma

# vt.*: the console colour palette, one value per colour 0-15.
#   Linux's defaults, for reference:
#     red: 0x00,0xaa,0x00,0xaa,0x00,0xaa,0x00,0xaa,0x55,0xff,0x55,0xff,0x55,0xff,0x55,0xff
#     grn: 0x00,0x00,0xaa,0x55,0x00,0x00,0xaa,0xaa,0x55,0x55,0xff,0xff,0x55,0x55,0xff,0xff
#     blu: 0x00,0x00,0x00,0x00,0xaa,0xaa,0xaa,0xaa,0x55,0x55,0x55,0x55,0xff,0xff,0xff,0xff
#   The table is not in ANSI order. From drivers/tty/vt/vt.c:
#     const unsigned char color_table[] = { 0, 4, 2, 6, 1, 5, 3, 7,
#                                           8,12,10,14, 9,13,11,15 };
#   so colour "3" takes the RGB values at index 6, for example.
GRUB_CMDLINE_LINUX_DEFAULT="vt.color=0x0B vt.default_red=0x10,0xaa,0x00,0xaa,0x00,0xaa,0x00,0xaa,0x55,0xff,0x55,0xff,0x55,0xff,0x00,0xff vt.default_grn=0x1a,0x00,0xaa,0x55,0x00,0x00,0xaa,0xaa,0x55,0x55,0xff,0xff,0x55,0x55,0xff,0xff vt.default_blu=0x20,0x00,0x00,0x00,0xaa,0xaa,0xaa,0xaa,0x55,0x55,0x55,0x55,0xff,0xff,0xc8,0xff splash"
