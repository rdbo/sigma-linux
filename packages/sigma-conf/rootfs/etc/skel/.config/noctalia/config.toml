# Sigma Linux — Noctalia
#
# Deep slate surfaces (#101a20 / #132a33), a single mint accent (#00ffc8),
# FiraCode everywhere. One floating glass bar, grouped capsules, panels that
# grow out of the bar.
#
# The palette lives in palettes/Sigma.json, the launcher logo in assets/.
# Changes made in Settings land in ~/.local/state/noctalia/settings.toml and
# win over this file; delete that file to come back here.

# ── Shell ─────────────────────────────────────────────────────────────────────

[shell]
font_family         = "FiraCode Nerd Font"
corner_radius_scale = 0.85          # slightly tighter than stock, like Sigma's 6/10px radii
time_format         = "{:%H:%M}"
date_format         = "%A, %d %B"
popup_shadows       = true
card_borders        = true
show_close_buttons  = false         # Esc / click-away closes everything; less chrome
polkit_agent        = true

[shell.animation]
enabled = true
speed   = 1.15                      # a touch snappier than default

[shell.shadow]
direction = "down"
alpha     = 0.6

[shell.panel]
transparency_mode        = "soft"   # cards read as layers over the slate
borders                  = true
border_color             = "outline_variant"
border_width             = 1.0
shadow                   = true
list_item_background     = true
launcher_placement       = "floating"
launcher_position        = "center"
clipboard_placement      = "floating"
clipboard_position       = "center"
control_center_placement = "attached"
wallpaper_placement      = "attached"
session_placement        = "floating"
floating_offset          = 10

[shell.launcher]
layout                 = "full"
width                  = 720
search_position        = "top"
default_view           = "recent"
show_navigation_labels = true
compact                = false
show_app_origin_indicator = false
provider_prefix        = "/"

[shell.launcher.providers.calculator]
prefix = "calc"
global = true

[shell.launcher.providers.session]
prefix = "session"
global = true                       # type "reboot" and go

[shell.window_switcher]
style        = "carousel"
mru          = true
show_caption = true

[shell.session]
grid           = false
show_shortcuts = true

# Same commands as sigma-power-menu: doas asks for the password in a floating foot.
[shell.session.power]
suspend  = "foot -a wmfloat doas zzz"
reboot   = "foot -a wmfloat doas reboot"
shutdown = "foot -a wmfloat doas poweroff"

[[shell.session.actions]]
action  = "lock"
variant = "outline"

[[shell.session.actions]]
action  = "suspend"
variant = "outline"

[[shell.session.actions]]
action  = "logout"
variant = "outline"

[[shell.session.actions]]
action  = "reboot"
variant = "secondary"

[[shell.session.actions]]
action            = "shutdown"
variant           = "destructive"
countdown_seconds = 3

[shell.screenshot]
freeze_screen        = true
region_border_width  = 2.0
region_dim_opacity   = 0.55

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode           = "dark"
source         = "custom"
custom_palette = "Sigma"

[theme.templates]
enable_builtin_templates   = true
builtin_ids                = []     # Sigma ships its own app themes
enable_community_templates = false

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = true
fill_mode           = "crop"
fill_color          = "surface"
directory           = "/usr/share/sigma/backgrounds"
transition          = ["fade", "disc", "wipe"]
transition_duration = 900
edge_smoothness     = 0.4

[wallpaper.default]
path = "/usr/share/sigma/backgrounds/wallpaper.png"

[backdrop]
enabled        = true
blur_intensity = 0.6
tint_intensity = 0.45

# ── Bar ───────────────────────────────────────────────────────────────────────
#
#  ( Σ )( 1 2 ▬3▬ 4 )  ▸ window title      Mon 02 Nov · 14:32      ♪ …  ( cpu ram disk )  tray  ( net bt vol bat )  ( 🔔 ⌨ ⏻ )

[bar]
order = ["sigma"]

[bar.sigma]
position             = "top"
thickness            = 38
margin_edge          = 6            # float off the screen edge
margin_ends          = 8
radius               = 14
background_opacity   = 0.88
compositor_blur      = true
border               = "outline_variant"
border_width         = 1.0
shadow               = true
contact_shadow       = true
padding              = 8
widget_spacing       = 12
font_weight          = 600
font_scale           = 0.9
font_family          = "FiraCode Nerd Font"
color                = "on_surface"
icon_color           = "primary"
hover_highlight      = true

capsule              = true
capsule_fill         = "surface_container"
capsule_opacity      = 0.9
capsule_thickness    = 0.74
capsule_padding      = 8
capsule_border       = ""

start  = ["launcher", "workspaces", "active_window"]
center = ["clock"]
end    = ["media", "group:stats", "tray", "group:status", "group:actions"]

[bar.sigma.dead_zone.actions]
left        = "panel-toggle launcher"
scroll_up   = "volume-up"
scroll_down = "volume-down"

[[bar.sigma.capsule_group]]
id             = "stats"
members        = ["cpu", "ram", "disk"]
fill           = "surface_container"
opacity        = 0.9
padding        = 10
widget_spacing = 12

[[bar.sigma.capsule_group]]
id             = "status"
members        = ["network", "bluetooth", "mic", "volume", "brightness", "battery", "battery-alt"]
fill           = "surface_container"
opacity        = 0.9
padding        = 10
widget_spacing = 10

[[bar.sigma.capsule_group]]
id             = "actions"
members        = ["notifications", "vkbd", "control-center", "session"]
fill           = "surface_container"
opacity        = 0.9
padding        = 10
widget_spacing = 10

# ── Bar widgets ───────────────────────────────────────────────────────────────

# The Σ logo from the wallpaper, bare: it anchors the bar on its own.
[widget.launcher]
custom_image          = "~/.config/noctalia/assets/sigma.svg"
custom_image_colorize = true
icon_color            = "primary"
capsule               = false
scale                 = 1.35

[widget.workspaces]
style                     = "regular"
show_labels               = true
label_source              = "id"
labels_only_when_occupied = true    # empty tags shrink to quiet dots
pill_scale                = 1.0
scale                     = 1.2     # bigger pills (pill_scale caps at 1.0)
active_pill_size          = 2.0
inactive_pill_size        = 1.0
focused_color             = "primary"
occupied_color            = "secondary_container"
empty_color               = "surface_container_highest"
urgent_color              = "tertiary"
change_color_on_hover     = false   # keep the active pill mint under the pointer
font_weight               = 700
capsule_padding           = 4

[widget.active_window]
display      = "icon_and_text"
max_length   = 300
icon_size    = 16
title_scroll = "on_hover"
capsule      = false
color        = "on_surface_variant"
font_weight  = 500

[widget.clock]
format         = "{:%a %d %b · %H:%M}"
tooltip_format = "{:%A, %d %B %Y}"
capsule        = false
color          = "primary"

[widget.media]
art_size           = 20
max_length         = 240
title_scroll       = "on_hover"
hide_when_no_media = true
color              = "on_surface_variant"

[widget.cpu]
type             = "sysmon"
stat             = "cpu_usage"
visualization    = "gauge"
label_min_width  = 34
highlight_color  = "tertiary"

[widget.ram]
type             = "sysmon"
stat             = "ram_pct"
visualization    = "gauge"
label_min_width  = 34
highlight_color  = "tertiary"

[widget.disk]
type             = "sysmon"
stat             = "disk_used_pct"
path             = "/"
visualization    = "gauge"
label_min_width  = 34
highlight_color  = "tertiary"

[widget.tray]
drawer           = true
drawer_columns   = 4
hide_passive     = true
capsule          = false

[widget.network]
show_label = false

[widget.mic]
type               = "volume"
device             = "input"
show_label         = false
hide_when_inactive = true
mute_color         = "error"

[widget.volume]
device     = "output"
show_label = true
mute_color = "error"

# The computer's own battery only, never a mouse or headset ("auto" falls back to
# those on desktops). Laptops call it BAT0, some BAT1; whichever is absent hides.
[widget.battery]
device        = "BAT0"
display_mode  = "glyph"
show_label    = true
warning_color = "tertiary"

[widget.battery-alt]
type          = "battery"
device        = "BAT1"
display_mode  = "glyph"
show_label    = true
warning_color = "tertiary"

[widget.notifications]
hide_when_no_unread = false

[widget.vkbd]
type    = "custom_button"
glyph   = "keyboard"
tooltip = "Virtual keyboard"

[widget.vkbd.actions]
left = "exec sigma-toggle-vkbd"

[widget.control-center]
glyph = "adjustments-horizontal"

[widget.session]
glyph      = "power"
icon_color = "error"

# ── Control center ────────────────────────────────────────────────────────────

[control_center]
circular_avatar    = true
show_avatar_border = true

[control_center.media]
show_visualizer = true

[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "caffeine"
[[control_center.shortcuts]]
type = "keyboard_layout"
[[control_center.shortcuts]]
type = "session"

# ── Notifications & OSD ───────────────────────────────────────────────────────

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
layer              = "top"
background_opacity = 0.94
border             = true
border_color       = "#00ffc84d"    # mint hairline, like mako's border but softer
border_width       = 1
offset_x           = 10
offset_y           = 10

[osd]
position           = "bottom_center"
orientation        = "horizontal"
hide_delay_ms      = 1200
background_opacity = 0.94
border             = true
border_color       = "#00ffc84d"
border_width       = 1
offset_y           = 48

# ── Lock screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled             = true
transition          = ["fade", "disc"]
transition_duration = 800
edge_smoothness     = 0.4
blur_intensity      = 0.7
tint_intensity      = 0.45

# ── Services ──────────────────────────────────────────────────────────────────

[system.monitor]
cpu_poll_seconds    = 1.5
memory_poll_seconds = 2.0
disk_poll_seconds   = 15.0

[audio]
enable_sounds = false
